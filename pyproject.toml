[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-coach"
version = "0.1.0"
description = "Personal Garmin Connect sync and coaching data pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "garminconnect>=0.2.40",
]

[project.scripts]
garmin-coach = "garmin_coach.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
